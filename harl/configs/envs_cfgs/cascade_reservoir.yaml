# Physical assumptions; the variable-head table is a sensitivity scenario.
head_model: storage_sensitivity  # fixed reproduces the original typical-head model
reservoir_ids: [WDD, BHT, XLD, XJB, THR]
level_bounds_m:
  WDD: [945, 975]
  BHT: [765, 825]
  XLD: [540, 600]
  XJB: [370, 380]
  THR: [145, 175]
efficiency: 0.90
water_density_kg_m3: 1000.0
gravity_m_s2: 9.81
timestep_seconds: 86400.0
release_mapping: linear
# CSV intervals are proposal references, never additional execution constraints.
release_mapping_mode: joint_feasible
release_bounds_file: five_reservoir_daily_release_bounds_1965_2024.csv
# A: baseline (both off); B: correction on; C: correction and penalty on.
# Existing dynamic intervals already encode the supported hard constraints.
action_correction:
  enabled: false
  penalty_enabled: false
  tau: 0.03
  correction_weight: 1.0
# Supplied permitted levels for the state reached after each action date.
use_daily_level_limits: true
# Reference guaranteed-output and ecological-flow thresholds from paper Table A.1.
load_service_requirements: true
# Current sensitivity experiment: both requirements are 40% of the reference.
# Each multiplier applies directly to the original CSV; use 1 to restore reference values.
guaranteed_output_scale: 1 #保证出力
ecological_flow_scale: 1 #生态流量
# Requirement-relative shortfalls averaged over each fixed active reservoir set.
# Unit weights are prespecified tradeoffs, not calibrated or monetary costs.
reward_penalties:
  enabled: true
  guaranteed_output_weight: 1.0
  ecological_flow_weight: 1.0
  # Learning-only frequency cost; service constraints remain soft.
  guaranteed_output_violation_weight: 1.0
